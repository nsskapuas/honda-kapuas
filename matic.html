<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATIC HONDA - NSS Kapuas</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#fff;padding-top:56px}
  #header{position:fixed;top:0;left:0;width:100%;z-index:1000}
  #header header{position:fixed !important;top:0;left:0;width:100% !important}
  .hero{position:relative;width:100%;height:220px;overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover}
  .hero-title{position:absolute;top:35%;left:0;width:100%;text-align:center;color:#fff;font-size:38px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .hero-title span{display:block;width:80%;height:6px;background:#e60000;margin:5px auto 0}
  .note{text-align:center;font-size:11px;color:#c00;font-style:italic;padding:8px 5px;background:#fff}
  .section{padding:15px 10px 5px;background:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .card{display:block;text-decoration:none;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .2s ease, box-shadow .2s ease;border:1px solid #eee}
  .card img{width:100%;height:120px;object-fit:contain;background:#fff;display:block;transition:transform .25s ease;padding:5px}
  .card p{text-align:center;font-weight:800;font-size:11px;color:#222;padding:8px 2px;background:#fff}
  .card:active{transform:scale(1.05)}
  .card:active img{transform:scale(1.08)}
  .card:hover{transform:scale(1.03);box-shadow:0 6px 15px rgba(0,0,0,.25)}
  .card:hover img{transform:scale(1.05)}
  .premium-title{text-align:center;font-weight:800;font-size:14px;padding:22px 0 12px;background:#fff}
  .premium-title::after{content:"";display:block;width:90%;height:2px;background:#e60000;margin:12px auto 0}
  .premium{background:#1a6b7a;padding:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .grid3 .card img{height:120px;object-fit:contain;background:#fff;padding:5px}
  .grid3 .card p{font-size:11px;padding:8px 2px}

  /* POPUP - SEBESAR ARSIRAN KUNING */
  #popupOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:flex;align-items:center;justify-content:center;padding:15px}
  #popupBox{position:relative;width:88%;max-width:380px;height:68vh;max-height:560px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column}
  #popupBox img{width:100%;height:55%;object-fit:contain;background:#fff;display:block}
  .popup-text{padding:15px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px}
  .popup-text h3{font-size:19px;font-weight:900;color:#111}
  .popup-text h3 span{color:#e60000}
  .popup-text p{font-size:13px;color:#555;line-height:1.5}
  .popup-wa{display:inline-block;background:#25D366;color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:11px 20px;border-radius:30px;margin-top:5px}
  #popupClose{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:#111;color:#fff;border:none;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
</style>
</head>
<body>

<div id="header"></div>

<div class="hero">
  <img src="assets/images/home/a0.webp" alt="Matic Honda">
  <div class="hero-title">MATIC HONDA<span></span></div>
</div>
<p class="note">*pilih gambar untuk melihat type & harga</p>

<div class="section">
  <div class="grid">
    <a class="card" href="varioevo.html"><img src="assets/images/home/a1.webp" alt="Vario 160"><p>VARIO EVO</p></a>
    <a class="card" href="vario125.html"><img src="assets/images/home/a2.webp" alt="Vario 125"><p>VARIO 125</p></a>
    <a class="card" href="beat.html"><img src="assets/images/home/a3.webp" alt="BeAT"><p>HONDA BeAT</p></a>
    <a class="card" href="beatstreet.html"><img src="assets/images/home/a4.webp" alt="BeAT Street"><p>BeAT StreeT</p></a>
    <a class="card" href="genio.html"><img src="assets/images/home/a5.webp" alt="Genio"><p>GENIO</p></a>
    <a class="card" href="scoopy.html"><img src="assets/images/home/a6.webp" alt="Scoopy"><p>SCOOPY</p></a>
  </div>
</div>

<div class="premium-title">MATIC PREMIUM</div>
<div class="premium">
  <div class="grid3">
    <a class="card" href="stylo.html"><img src="assets/images/home/a7.webp" alt="Stylo"><p>STYLO</p></a>
    <a class="card" href="adv.html"><img src="assets/images/home/a8.webp" alt="ADV 160"><p>ADV 160</p></a>
    <a class="card" href="pcx.html"><img src="assets/images/home/a9.webp" alt="PCX"><p>PCX 160</p></a>
  </div>
</div>

<div id="footer"></div>

<!-- POPUP - FOTO ab0.webp -->
<div id="popupOverlay">
  <div id="popupBox">
    <img src="assets/images/home/ab0.webp" alt="Promo">
    <div class="popup-text">
      <h3>PROMO <span>SPESIAL</span> MATIC!</h3>
      <p>DP Ringan, Angsuran Murah & Proses Cepat.<br>Chat WA sekarang, unit langsung diproses!</p>
      <a class="popup-wa" href="https://wa.me/6281234567890">Chat WA Sekarang</a>
    </div>
    <button id="popupClose">✕</button>
  </div>
</div>

<script>
  fetch('header.html').then(r=>r.text()).then(t=>document.getElementById('header').innerHTML=t);
  fetch('footer.html').then(r=>r.text()).then(t=>document.getElementById('footer').innerHTML=t);
  document.getElementById('popupClose').onclick = function(){
    document.getElementById('popupOverlay').style.display='none';
  };
  document.getElementById('popupOverlay').onclick = function(e){
    if(e.target === this) this.style.display='none';
  };
</script>

</body>
</html>
