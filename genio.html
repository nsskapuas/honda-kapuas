<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honda Genio - NSS Kapuas</title>
<style>
  /* INI KUNCINYA BIAR HEADER NEMPEL */
  #header{position:sticky;top:0;z-index:999}
  *{box-sizing:border-box} body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0}
  .wrap{max-width:600px;margin:0 auto;padding:16px}
  .slider-wrap{position:relative;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.1)}
  .slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  .slider::-webkit-scrollbar{display:none}
  .slide{min-width:100%;scroll-snap-align:center;padding:16px;text-align:center}
  .slide img{width:100%;display:block;margin:0 auto;border-radius:10px;object-fit:contain}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid #ddd;font-size:18px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .nav.prev{left:10px} .nav.next{right:10px}
  .hint{text-align:center;font-size:12px;color:#999;margin:12px 0 8px}
  .thumbs{display:flex;gap:6px;margin:10px 0;overflow-x:auto;padding-bottom:6px;justify-content:flex-start;scroll-behavior:smooth}
  .thumbs::-webkit-scrollbar{display:none}
  .thumb{min-width:20%;max-width:20%;background:#fff;border-radius:8px;padding:4px;text-align:center;border:2px solid #ddd;cursor:pointer;flex-shrink:0;transition:border-color .25s ease, transform .25s ease}
  .thumb.active{border-color:#e60012;transform:scale(1.03)}
  .thumb img{width:100%;border-radius:4px}
  .thumb span{font-size:9px;display:block;margin-top:2px;line-height:1.2}
  .price{background:#fff;border-radius:12px;padding:14px;text-align:center}
  .price b{font-size:22px;color:#e60012}
  .price span{display:block;font-size:12px;color:#888}
  .specs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
  .specs span{background:#fff;padding:8px 12px;border-radius:20px;font-size:13px}
  .wa{display:block;background:#25D366;color:#fff;text-align:center;padding:14px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:16px;margin-top:16px}
  .judul{ text-align:center; padding:16px 0 0; }
  .judul b{font-size:22px}
  .judul span{font-size:12px;color:#888}
  /* TAMBAHAN BANNER - GAK NGANGGU KODE LAMA */
  .banner-atas{max-width:600px;margin:12px auto 0;padding:0 16px}
  .banner-atas img{width:100%;display:block;border-radius:14px}
  .banner-bawah{max-width:600px;margin:0 auto;padding:0 16px 16px}
  .banner-bawah-wrap{position:relative;border-radius:14px;overflow:hidden}
  .banner-bawah-slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  .banner-bawah-slider::-webkit-scrollbar{display:none}
  .banner-bawah-slide{min-width:100%;scroll-snap-align:center}
  .banner-bawah-slide img{width:100%;display:block}
  .banner-dots{text-align:center;margin-top:8px}
  .banner-dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccc;margin:0 3px;cursor:pointer}
  .banner-dots span.active{background:#e60012}
</style>
</head>
<body>

<div id="header"></div>

  <!-- BANNER ATAS - A1 -->
  <div class="banner-atas"><img src="assets/images/matic/genio/A1.jpg"></div>

  <div class="judul"><b>HONDA GENIO</b><br><span>DEALER HONDA NSS KAPUAS</span></div>

  <div class="wrap">
    <div class="slider-wrap">
      <div class="slider" id="slider">
        <div class="slide"><img src="assets/images/matic/genio/genio-cbs-bk.webp"></div>
        <div class="slide"><img src="assets/images/matic/genio/genio-cbs-bl.webp"></div>
        <div class="slide"><img src="assets/images/matic/genio/genio-cbs-bw.webp"></div>
        <div class="slide"><img src="assets/images/matic/genio/genio-cbsiss-bk.webp"></div>
        <div class="slide"><img src="assets/images/matic/genio/genio-cbsiss-bw.webp"></div>
        <div class="slide"><img src="assets/images/matic/genio/genio-cbsiss-gr.webp"></div>
      </div>
      <button class="nav prev" onclick="geser(-1)">‹</button>
      <button class="nav next" onclick="geser(1)">›</button>
    </div>

    <p class="hint">👆 Geser gambar untuk lihat warna lain</p>

    <div class="thumbs" id="thumbs">
      <div class="thumb active" onclick="pilih(0)"><img src="assets/images/matic/genio/genio-cbs-bk.webp"><span>CBS Hitam</span></div>
      <div class="thumb" onclick="pilih(1)"><img src="assets/images/matic/genio/genio-cbs-bl.webp"><span>CBS Biru</span></div>
      <div class="thumb" onclick="pilih(2)"><img src="assets/images/matic/genio/genio-cbs-bw.webp"><span>CBS Putih</span></div>
      <div class="thumb" onclick="pilih(3)"><img src="assets/images/matic/genio/genio-cbsiss-bk.webp"><span>ISS Hitam</span></div>
      <div class="thumb" onclick="pilih(4)"><img src="assets/images/matic/genio/genio-cbsiss-bw.webp"><span>ISS Putih</span></div>
      <div class="thumb" onclick="pilih(5)"><img src="assets/images/matic/genio/genio-cbsiss-gr.webp"><span>ISS Hijau</span></div>
    </div>

    <div class="price"><span>Harga Mulai (OTR Kapuas)</span><b>Rp 20 Jutaan*</b><span>*Chat admin untuk harga pasti</span></div>
    <div class="specs"><span>110cc eSP</span><span>Irit 59,1 km/L</span><span>LED + ISS</span></div>
    <a class="wa" href="https://wa.me/6281234567890?text=Halo,%20saya%20mau%20tanya%20Honda%20Genio">💬 TANYA HARGA VIA WHATSAPP</a>
  </div>

  <!-- BANNER BAWAH - B1, B2 - BISA SLIDE -->
  <div class="banner-bawah">
    <div class="banner-bawah-wrap">
      <div class="banner-bawah-slider" id="bannerBawahSlider">
        <div class="banner-bawah-slide"><img src="assets/images/matic/genio/B1.jpg"></div>
        <div class="banner-bawah-slide"><img src="assets/images/matic/genio/B2.jpg"></div>
      </div>
    </div>
    <div class="banner-dots" id="bannerBawahDots">
      <span class="active" onclick="pilihBannerBawah(0)"></span>
      <span onclick="pilihBannerBawah(1)"></span>
    </div>
  </div>

<div id="footer"></div>

<script>
const slider=document.getElementById('slider');
const thumbs=document.querySelectorAll('.thumb');
let idx=0;
let isProgrammatic=false;
let scrollTimer=null;

function setActive(i){
  if(i===idx) return;
  idx=i;
  thumbs.forEach((t,j)=>t.classList.toggle('active',j===i));
  thumbs[i].scrollIntoView({behavior:'smooth', inline:'nearest', block:'nearest'});
}
function pilih(i){
  setActive(i);
  isProgrammatic=true;
  slider.scrollTo({left: slider.clientWidth*i, behavior:'smooth'});
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{ isProgrammatic=false; }, 450);
}
function geser(d){
  let n=idx+d; if(n<0)n=0; if(n>5)n=5;
  pilih(n);
}
slider.addEventListener('scroll',()=>{
  if(isProgrammatic) return;
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    let n=Math.round(slider.scrollLeft/slider.clientWidth);
    if(n!==idx) setActive(n);
  }, 80);
});

// PANGGIL HEADER + FOOTER - SUDAH ANTI 404
function loadPart(file, id){
  fetch(file).then(r=>{
    if(!r.ok) throw new Error('File '+file+' tidak ketemu');
    return r.text();
  }).then(h=>{ document.getElementById(id).innerHTML=h; })
  .catch(e=>{ console.log(e.message); document.getElementById(id).style.display='none'; });
}
loadPart('header.html','header');
loadPart('footer.html','footer');

// SLIDER BANNER BAWAH - B1, B2 - AUTO + MANUAL
const bannerBawahSlider=document.getElementById('bannerBawahSlider');
const bannerBawahDots=document.querySelectorAll('#bannerBawahDots span');
let bannerBawahIdx=0;
function pilihBannerBawah(i){
  bannerBawahIdx=i;
  bannerBawahSlider.scrollTo({left: bannerBawahSlider.clientWidth*i, behavior:'smooth'});
  bannerBawahDots.forEach((d,j)=>d.classList.toggle('active',j===i));
}
setInterval(()=>{
  let n=bannerBawahIdx+1; if(n>1) n=0;
  pilihBannerBawah(n);
},4000);
bannerBawahSlider.addEventListener('scroll',()=>{
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    let n=Math.round(bannerBawahSlider.scrollLeft/bannerBawahSlider.clientWidth);
    if(n!==bannerBawahIdx){ bannerBawahIdx=n; bannerBawahDots.forEach((d,j)=>d.classList.toggle('active',j===n)); }
  },80);
});
</script>
</body>
</html>
