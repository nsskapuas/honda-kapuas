
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honda Genio - Pilihan Warna</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:16px}
  h1{text-align:center}
  p{text-align:center;color:#555}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:800px;margin:20px auto}
  .card{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .card img{width:100%;border-radius:8px}
  .card b{display:block;margin-top:8px}
  .card span{font-size:13px;color:#777}
  @media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <h1>HONDA GENIO</h1>
  <p>Pilih warna favoritmu</p>

  <div class="grid">
    <div class="card">
      <img src="assets/images/matic/genio/genio-cbs-bk.webp">
      <b>Genio CBS - Hitam</b><span>CBS Black</span>
    </div>
    <div class="card">
      <img src="assets/images/matic/genio/genio-cbs-bl.webp">
      <b>Genio CBS - Biru</b><span>CBS Blue</span>
    </div>
    <div class="card">
      <img src="assets/images/matic/genio/genio-cbs-bw.webp">
      <b>Genio CBS - Putih</b><span>CBS White</span>
    </div>
    <div class="card">
      <img src="assets/images/matic/genio/genio-cbsiss-bk.webp">
      <b>Genio CBS ISS - Hitam</b><span>CBS ISS Black</span>
    </div>
    <div class="card">
      <img src="assets/images/matic/genio/genio-cbsiss-bw.webp">
      <b>Genio CBS ISS - Putih</b><span>CBS ISS White</span>
    </div>
    <div class="card">
      <img src="assets/images/matic/genio/genio-cbsiss-gr.webp">
      <b>Genio CBS ISS - Hijau</b><span>CBS ISS Green</span>
    </div>
  </div>
</body>
</html>
